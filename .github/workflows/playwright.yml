name: TNPSC Playwright Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Login tests - 5:00 AM IST
    - cron: '30 23 * * *'

    # Signup tests - 5:10 AM IST
    - cron: '40 23 * * *'

    # Contest tests - 5:20 AM IST
    - cron: '50 23 * * *'

    # Books tests - 0:00 AM UTC / 5:30 AM IST
    - cron: '0 0 * * *'

    # Offline Books tests - 5:40 AM IST
    - cron: '10 0 * * *'

    # Subject and Quiz tests - 5:50 AM IST
    - cron: '20 0 * * *'

jobs:
  playwright-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Login tests
        if: github.event_name != 'schedule' || github.event.schedule == '30 23 * * *'
        run: npx playwright test tests/signInTest.spec.js --project=chromium

      - name: Run Signup tests
        if: github.event_name != 'schedule' || github.event.schedule == '40 23 * * *'
        run: npx playwright test tests/signUpTest.spec.js --project=chromium

      - name: Run Contest tests
        if: github.event_name != 'schedule' || github.event.schedule == '50 23 * * *'
        run: npx playwright test tests/contestTest.spec.js --project=chromium

      - name: Run Books tests
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: npx playwright test tests/booksTest.spec.js --project=chromium

      - name: Run Offline Books tests
        if: github.event_name != 'schedule' || github.event.schedule == '10 0 * * *'
        run: npx playwright test tests/offlineBooksTest.spec.js --project=chromium

      - name: Run Subject and Quiz tests
        if: github.event_name != 'schedule' || github.event.schedule == '20 0 * * *'
        run: npx playwright test tests/subjectTest.spec.js --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnpsc-playwright-report
          path: playwright-report/
          retention-days: 30